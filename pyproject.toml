[project]
name = "infomentor-digest"
version = "0.1.0"
description = "Reads InfoMentor for school and preschool, then sends a summary to Telegram or SMTP."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
infomentor-digest = "infomentor_digest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infomentor_digest"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
